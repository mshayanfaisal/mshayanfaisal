name: Update GitHub Stats

on:
  # Run once a day at 00:15 UTC
  schedule:
    - cron: "15 0 * * *"
  # Run whenever code is pushed to the default branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Needed so the job can commit the regenerated SVGs back to the repo
permissions:
  contents: write

# Never let two runs (push + schedule + manual) execute at once and race the push
concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r cache/requirements.txt

      - name: Generate stats SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update GitHub stats [skip ci]"
          # Retry with a rebase in case main moved under us (keeps our fresh stats on conflict)
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto latest main (attempt $attempt)..."
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
          done
          echo "Failed to push after 3 attempts." >&2
          exit 1
